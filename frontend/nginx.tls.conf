# Manual-certificate prod mode: nginx terminates TLS itself. Bind-mounted over
# /etc/nginx/conf.d/default.conf by compose.prod.tls.yml (so switching modes
# needs no image rebuild). Provide the certificate at the paths below via the
# ./volumes/certs mount. See the Production section in README.md.

# Use the client's forwarded scheme if present (e.g. a proxy ahead of us),
# otherwise our own listen scheme. Shared with the plain-HTTP mode.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

# Redirect all plaintext traffic to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: only meaningful once TLS is terminated here. Two years, subdomains.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/snippets/isachore-common.conf;
}
