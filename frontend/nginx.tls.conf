# Manual-certificate prod mode: nginx terminates TLS itself. Bind-mounted over
# /etc/nginx/conf.d/default.conf by compose.prod.tls.yml (so switching modes
# needs no image rebuild). Provide the certificate at the paths below via the
# ./volumes/certs mount. See the Production section in README.md.

# Use the client's forwarded scheme if present (e.g. a proxy ahead of us),
# otherwise our own listen scheme. Shared with the plain-HTTP mode.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

# Redirect all plaintext traffic to HTTPS.
server {
    listen 80;
    server_name _;

    # This block does not include the common snippet, so it needs its own copy:
    # otherwise the redirect and the healthcheck responses still advertise the
    # nginx version.
    server_tokens off;

    # Exempt from the redirect so the container healthcheck can probe plain HTTP
    # over the loopback: following a 301 to https://127.0.0.1/ would fail
    # certificate validation. Duplicated from nginx-common.conf because this
    # block cannot include that snippet (it would serve the whole app over plain
    # HTTP). This copy inherits no security headers, since this server block
    # sets none; harmless for a static "ok".
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla's "intermediate" suite minus its DHE entries, so only ECDHE key
    # exchange is ever offered. That is also why no ssl_dhparam file is needed:
    # a DH group is only used by the DHE suites we do not offer. TLS 1.3 picks
    # its own suites and ignores this list (see the group note below).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Let the client choose within that list: every suite in it is AEAD, and
    # clients know their own hardware best (matters for CHACHA20 on mobile).
    ssl_prefer_server_ciphers off;
    # Deliberately NO ssl_ecdh_curve. That directive REPLACES OpenSSL's default
    # group list, and the bundled OpenSSL (3.5) leads its default with the
    # post-quantum hybrid X25519MLKEM768, so pinning classical curves here would
    # silently downgrade every modern browser to classical-only key exchange.
    # The default list is already ECDHE-strong; leave it alone.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Tickets would need key rotation to keep forward secrecy; the shared cache
    # above already gives resumption without that burden.
    ssl_session_tickets off;

    # OCSP stapling is deliberately NOT enabled. Let's Encrypt stopped serving
    # OCSP in 2025 and no longer puts an OCSP URI in its certificates, and the
    # CA/Browser Forum has made OCSP optional, so `ssl_stapling on` would be a
    # no-op plus a warning on every start. If your CA still publishes OCSP, add
    # `ssl_stapling on; ssl_stapling_verify on;`, point
    # `ssl_trusted_certificate` at a chain.pem in ./volumes/certs, and add a
    # `resolver` nginx can use to reach the responder.

    # HSTS: only meaningful once TLS is terminated here. Two years, subdomains.
    # No `preload`: getting onto the browsers' preload list is effectively
    # irreversible for the whole domain, so that is the operator's call.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/snippets/isachore-common.conf;
}
