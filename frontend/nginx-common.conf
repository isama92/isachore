# Shared server-block body for both prod modes: nginx.conf (plain HTTP, behind a
# TLS-terminating reverse proxy) and nginx.tls.conf (nginx terminates TLS with a
# provided certificate). Baked into the image at
# /etc/nginx/snippets/isachore-common.conf and `include`d inside a server {}
# block. Keep to server-context directives so both modes stay identical.

# Security response headers, on every response (errors included, hence `always`).
# HSTS is deliberately NOT here: it belongs only where TLS is terminated
# (nginx.tls.conf, or the upstream proxy in reverse-proxy mode).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

root /usr/share/nginx/html;
index index.html;

# No URI on proxy_pass: the original path (/api/v1/...) is forwarded
# untouched, matching FastAPI's /api/v1 prefix.
location /api/ {
    # Bound request bodies at the transport level so an oversized avatar
    # upload is rejected here rather than fully buffered by the backend.
    # A little above the 5 MB avatar cap to allow multipart overhead. Keep in
    # sync with the backend's MAX_REQUEST_BYTES (its own defence-in-depth cap).
    client_max_body_size 6m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Preserve the client's real scheme when behind a TLS-terminating proxy;
    # fall back to our own listen scheme otherwise (see the $forwarded_proto map).
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# SPA fallback so /login deep-links survive a refresh
location / {
    try_files $uri $uri/ /index.html;
}
