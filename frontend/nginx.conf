server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No URI on proxy_pass: the original path (/api/v1/...) is forwarded
    # untouched, matching FastAPI's /api/v1 prefix.
    location /api/ {
        # Bound request bodies at the transport level so an oversized avatar
        # upload is rejected here rather than fully buffered by the backend.
        # A little above the 5 MB avatar cap to allow multipart overhead.
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so /login deep-links survive a refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
