            - type: string
              enum:
                - latte
                - frappe
                - macchiato
                - mocha
            - type: 'null'
          title: Theme
        accent_color:
          anyOf:
            - type: string
              enum:
                - rosewater
                - flamingo
                - pink
                - mauve
                - red
                - maroon
                - peach
                - yellow
                - green
                - teal
                - sky
                - sapphire
                - blue
                - lavender
            - type: 'null'
          title: Accent Color
        language:
          anyOf:
            - type: string
              enum:
                - en
                - it
            - type: 'null'
          title: Language
        two_factor_enabled:
          type: boolean
          title: Two Factor Enabled
          default: false
        impersonating:
          type: boolean
          title: Impersonating
          default: false
        memberships:
          items:
            $ref: '#/components/schemas/MembershipRead'
          type: array
          title: Memberships
          default: []
        email_confirmation_required:
          type: boolean
          title: Email Confirmation Required
          default: false
        avatar_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Avatar Url
          description: |-
            URL the SPA can load the avatar from. Served by the StaticFiles mount
            at /api/v1/media (proxied untouched by the prod nginx /api rule).
          readOnly: true
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - is_admin
        - status
        - created_at
        - avatar_url
      title: MeRead
    MembershipRead:
      properties:
        household_id:
          type: integer
          title: Household Id
        role:
          $ref: '#/components/schemas/HouseholdRole'
        owned:
          type: boolean
          title: Owned
      type: object
      required:
        - household_id
        - role
        - owned
      title: MembershipRead
      description: |-
        One of the caller's household memberships: which household, what they may do in it,
        and whether they own *this* household (not whether they own any).

        Ownership is `households.admin_id`, a separate fact from the role ladder rather than a
        rung on it: the owner is always an organiser, but not every organiser owns. It rides here
        because the sidebar has to decide whether to offer the Logs page before any household has
        been fetched.
    Page_ChoreListRead_:
