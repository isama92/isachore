      type: object
      required:
        - email
        - first_name
        - last_name
      title: UserCreate
    UserRead:
      properties:
        id:
          type: integer
          title: Id
        email:
          type: string
          title: Email
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        is_admin:
          type: boolean
          title: Is Admin
        status:
          $ref: '#/components/schemas/UserStatus'
        confirmed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Confirmed At
        created_at:
          type: string
          format: date-time
          title: Created At
        theme:
