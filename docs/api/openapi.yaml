          schema:
            type: integer
            title: Chore Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoreUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoreRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - chores
      summary: Delete Chore
      operationId: delete_chore_api_v1_chores__chore_id__delete
      parameters:
        - name: chore_id
          in: path
          required: true
          schema:
            type: integer
            title: Chore Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chores/{chore_id}/complete:
    post:
      tags:
        - chores
      summary: Complete Chore
      description: |-
        Mark a chore's current occurrence done. Any member of the chore's household
        may complete it. Flips the open occurrence to `done` (the history row) and materialises
        the next open occurrence - one interval on for a recurring chore, at the completion
        moment for an unscheduled one, reassigned to the next person when the turn ends (see
        _successor_assignee). Every chore therefore stays completable, over and over.

        By default the completion is credited to the caller. An optional
        `completed_by_user_id` credits it to another member so the History shows it under
        their name (used by the Home due view's credit dialog), but only if that member is
        one of the chore's assignees; the assignee pool is never modified.
      operationId: complete_chore_api_v1_chores__chore_id__complete_post
      parameters:
        - name: chore_id
          in: path
          required: true
          schema:
            type: integer
            title: Chore Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/CompleteChoreRequest'
                - type: 'null'
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chores/{chore_id}/skip:
    post:
      tags:
        - chores
      summary: Skip Chore
      description: |-
        Skip a chore's current occurrence: close it and move the chore on to its next slot
        without recording any work. Ungated like completing, since every role that can complete a
        chore can decide not to do one.

        Two things it deliberately is not. It takes no `completed_by_user_id`, because there is no
        credit to hand out - a skip is always recorded against whoever pressed the button. And it
        refuses an unscheduled chore (400): those are never due, so there is no deadline to move
        past and nothing to skip. That refusal is also what keeps "every skipped row belongs to a
        scheduled chore" true at the data layer rather than only in the UI, which is what lets the
        punctuality breakdown in stats.py host a skipped slice alongside its three due-date ones.

        Deliberately UNBOUNDED, as a recorded decision rather than an oversight: nothing checks
        that the occurrence is actually due, so a chore can be skipped repeatedly and pushed
        arbitrarily far forward, and skipping somebody else's chore moves their deadline with no
        notification. That is exactly the latitude completing already has (nothing stops you
        completing a chore weeks early either), every skip leaves a history row naming who did it,
        and Home only ever surfaces overdue/today/soon, so a pushed-out chore simply leaves the
        view. Bounding it would need a notion of "too early" that the completion path does not
        have; if that is ever wanted, both paths should get it together.
      operationId: skip_chore_api_v1_chores__chore_id__skip_post
      parameters:
        - name: chore_id
          in: path
          required: true
          schema:
            type: integer
            title: Chore Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/completions/filters:
    get:
      tags:
        - completions
      summary: Completion Filters
      description: |-
        The option lists for the History filters: the households the user belongs
        to, and the distinct active members across them (candidate completers).

        Deliberately NOT narrowed by role, unlike the history list right below it. This
        endpoint also feeds the filter bars on Home and Unscheduled (see
        `frontend/src/components/chores/useFilterOptions.ts`), which every role uses, so
        restricting it to deputies would empty the household and member pickers there. Note
        that makes it a superset of what History can show a helper (their own closures only),
        which is why History hides its filter bar entirely rather than narrowing this. It
        exposes household names and member names, both of which every member already sees on
        Home.
      operationId: completion_filters_api_v1_completions_filters_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryFilterOptions'
  /api/v1/completions:
    get:
      tags:
        - completions
      summary: List Completions
      description: |-
        Chore history across every active household the caller belongs to, narrowed per
        household by their role: where they are at least a deputy they see everybody's closures,
        where they are only a helper they see their own and nothing else. Reads the `done`
        occurrences of the merged occurrences table, which is both real completions and skips:
        each entry carries `skipped` so the list can tell them apart, and `outcome` narrows to
        one kind. Optional user_id / household_id narrow the list too; a household they do not
        belong to, or a stranger's id in a household they are only a helper in, yields an empty
        page rather than a 403, since the list spans every household at once. History of
        soft-deleted chores is kept (the title is snapshotted for exactly this and the chore row
        still resolves the join).
      operationId: list_completions_api_v1_completions_get
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Page Size
        - name: sort_by
          in: query
          required: false
          schema:
            enum:
              - created_at
              - title
            type: string
            default: created_at
            title: Sort By
        - name: sort_dir
          in: query
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
            default: desc
            title: Sort Dir
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: User Id
        - name: household_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: Household Id
        - name: outcome
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - completed
                  - skipped
                type: string
              - type: 'null'
            title: Outcome
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_HistoryEntryRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/completions/{completion_id}:
    delete:
      tags:
        - completions
      summary: Undo Completion
      description: |-
        Undo a closure, completion or skip alike (identified by its done-occurrence id).
        Either the user it is recorded against (completed_by) or an organiser of that household
        may undo it. Both halves matter: the occurrence stores no separate record of who
        submitted it, so somebody who completes a chore on another member's behalf cannot undo
        it themselves, and before the organiser half existed a helper's closure could be undone
        by nobody at all.
        Undoing the chore's latest closure (the most recently *closed* one, see below)
        reopens that occurrence (deleting the successor open occurrence first) so the chore is
        available again with its original assignee; undoing an older one just removes that
        history row. A skip counts as a closure for "latest" here, because it really did close
        its slot and its successor really is the open row. Note that reopening rolls a rotating
        chore's turn back, so an organiser undoing a housemate's closure can move work between
        people - deliberately, since fixing a mis-skip is the point.
      operationId: undo_completion_api_v1_completions__completion_id__delete
      parameters:
        - name: completion_id
          in: path
          required: true
          schema:
            type: integer
            title: Completion Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stats:
    get:
      tags:
        - stats
      summary: Get Stats
      description: |-
        Aggregated completion and overdue statistics across the active households where the
        caller is at least a deputy (so housemates' work is included), for the Statistics page.

        `range` (7d/30d/90d) windows the completion-based metrics; the overdue snapshot
        (`status_breakdown`, `currently_overdue`, `active_chores`) is always live. Optional
        `household_id` narrows to one household; `user_id` narrows completions to that
        person's credited completions and the live snapshot to occurrences currently on
        their plate. A household/person the user can't see just yields empty scope, and so does a
        household they are only a helper in - a helper is not shown other people's numbers, and
        the page spans every household at once, so narrowing the scope is what enforces that
        rather than a 403.

        Unscheduled chores have no deadline, so they are counted where the question is "how much
        got done, and by whom" (`completed_in_range`, `completions_over_time`, `per_person`) and
        excluded where the answer needs a due date (`currently_overdue`, `status_breakdown`,
        `active_chores`, `punctuality`, `on_time_rate`). One consequence to keep in mind:
        `punctuality` therefore does not sum to `completed_in_range`.

        Skipped occurrences are closures that produced no work, so every "work done" metric here
        excludes them and they are reported alongside instead: `skipped_in_range`, a per-bucket
        `skipped` on `completions_over_time`, and a fourth `punctuality` bucket. Two notes on that
        last one. It is the one place the two exclusions meet, and it is not a special case: skips
        are counted inside the same `repeats != manual` branch as the three due-date buckets, so
        the four together are exactly the scheduled occurrences that closed in the range. And
        `on_time_rate` deliberately does NOT count skips in its denominator, staying "of the work
        that was done, how much was punctual" - so the four buckets do not add up to that rate's
        base either.

        `most_skipped` is the one skip figure here that answers *which* chore rather than how
        many, so it is also the one that drops soft-deleted chores: it is a shortlist to act on,
        and a deleted chore cannot be. Their skips do still count in `skipped_in_range`, so the
        ranking deliberately does not sum to that KPI.
      operationId: get_stats_api_v1_stats_get
      parameters:
        - name: range
          in: query
          required: false
          schema:
            enum:
              - 7d
              - 30d
              - 90d
            type: string
            default: 30d
            title: Range
        - name: household_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: Household Id
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/logs:
    get:
      tags:
        - logs
      summary: List Log Entries
      description: |-
        The activity log of every active household the caller OWNS, newest first.

        Ownership rather than a role: an organiser manages the chores, and this is the record of
        that management, so it answers to whoever the household belongs to. A non-owner - organiser
        included - gets an empty page rather than a 403, because the list spans several households
        at once and narrowing is what that surface does. Same for `household_id` naming a household
        they do not own, and `user_id` narrows by the *actor*.
      operationId: list_log_entries_api_v1_logs_get
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Page Size
        - name: sort_by
          in: query
          required: false
          schema:
            const: created_at
            type: string
            default: created_at
            title: Sort By
        - name: sort_dir
          in: query
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
            default: desc
            title: Sort Dir
        - name: household_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: Household Id
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: User Id
        - name: action
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/HouseholdLogAction'
              - type: 'null'
            title: Action
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_LogEntryRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssignmentType:
      type: string
      enum:
        - manual
        - alphabetical
        - random
        - least_done
      title: AssignmentType
    AuthMethodsRead:
      properties:
        password_enabled:
          type: boolean
          title: Password Enabled
        oidc_enabled:
          type: boolean
          title: Oidc Enabled
        oidc_provider_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Oidc Provider Name
      type: object
      required:
        - password_enabled
        - oidc_enabled
      title: AuthMethodsRead
      description: |-
        Which ways in the login page should offer. Public and unauthenticated, because
        the page that needs it is the one nobody has signed in to yet.

        Safe to expose: it carries no secret and nothing account-specific, only what a
        visitor is about to be shown anyway. The admin-only /settings payload reports the
        same provider from an operator's angle (issuer, client id, the redirect uri to
        register), which is why this one stays deliberately minimal - a public endpoint is
        the wrong place to grow configuration detail.
    Body_upload_avatar_api_v1_profile_avatar_put:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
        - file
      title: Body_upload_avatar_api_v1_profile_avatar_put
    ChoreCreate:
      properties:
        household_id:
          type: integer
          title: Household Id
        title:
          type: string
          maxLength: 255
          minLength: 1
          title: Title
        description:
          anyOf:
            - type: string
              maxLength: 20000
            - type: 'null'
          title: Description
        start_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Start Date
        repeats:
          $ref: '#/components/schemas/RepeatPeriod'
        assignment_type:
          $ref: '#/components/schemas/AssignmentType'
        turn_length:
          type: integer
          minimum: 1
          title: Turn Length
          default: 1
        repeat_interval:
          type: integer
          maximum: 365
          minimum: 1
          title: Repeat Interval
          default: 1
        weekdays:
          anyOf:
            - items:
                type: integer
                maximum: 6
                minimum: 0
              type: array
            - type: 'null'
          title: Weekdays
        assignee_ids:
          items:
            type: integer
          type: array
          title: Assignee Ids
        current_assignee_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Current Assignee Id
        clear_current_assignee:
          type: boolean
          title: Clear Current Assignee
          default: false
        tag_ids:
          items:
            type: integer
          type: array
          title: Tag Ids
      type: object
      required:
        - household_id
        - title
        - repeats
        - assignment_type
      title: ChoreCreate
    ChoreHouseholdRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        timezone:
          type: string
          title: Timezone
      type: object
      required:
        - id
        - name
        - timezone
      title: ChoreHouseholdRead
      description: |-
        The household a chore belongs to, embedded in both chore reads (it sits on
        ChoreReadBase) so the list column and the read-only edit header can show its name
        without a second request.

        Also embedded in `DueChoreRead`, `UnscheduledChoreRead`, `HistoryEntryRead` and the
        History filter options, which is what makes `timezone` here reach every household-scoped
        surface at once.
    ChoreListRead:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        start_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Start Date
        repeats:
          $ref: '#/components/schemas/RepeatPeriod'
        assignment_type:
          $ref: '#/components/schemas/AssignmentType'
        turn_length:
          type: integer
          title: Turn Length
        repeat_interval:
          type: integer
          title: Repeat Interval
        weekdays:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          title: Weekdays
        created_at:
          type: string
          format: date-time
          title: Created At
        household:
          $ref: '#/components/schemas/ChoreHouseholdRead'
        assignees:
          items:
            $ref: '#/components/schemas/HouseholdMemberRead'
          type: array
          title: Assignees
        current_assignee:
          anyOf:
            - $ref: '#/components/schemas/HouseholdMemberRead'
            - type: 'null'
        tags:
          items:
            $ref: '#/components/schemas/TagRead'
          type: array
          title: Tags
        has_description:
          type: boolean
          title: Has Description
      type: object
      required:
        - id
        - title
        - start_date
        - repeats
        - assignment_type
        - turn_length
        - repeat_interval
        - weekdays
        - created_at
        - household
        - assignees
        - tags
        - has_description
      title: ChoreListRead
      description: |-
        A row of the management list.

        The management table never renders the HTML, and at 100 rows a page a
        `MAX_RICH_TEXT_LENGTH` field on each was by some way the largest payload in the app
        (measured on the dev seed with five described chores: 103 kB down to 12 kB). Whoever
        wants the description reads the chore.

        Unlike DueChoreRead / UnscheduledChoreRead, whose flag drives the marker icon on the
        ChoreRow, nothing on the management page renders this one *yet*: it is here so every
        chore list answers "is there a description" the same way, and so adding that marker
        later needs no API change.

        NULL is the only "no description" - `core.richtext` collapses visually-empty HTML on
        write - so this needs no emptiness check.
    ChoreRead:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        start_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Start Date
        repeats:
          $ref: '#/components/schemas/RepeatPeriod'
        assignment_type:
          $ref: '#/components/schemas/AssignmentType'
        turn_length:
          type: integer
          title: Turn Length
        repeat_interval:
          type: integer
          title: Repeat Interval
        weekdays:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          title: Weekdays
        created_at:
          type: string
          format: date-time
          title: Created At
        household:
          $ref: '#/components/schemas/ChoreHouseholdRead'
        assignees:
          items:
            $ref: '#/components/schemas/HouseholdMemberRead'
          type: array
          title: Assignees
        current_assignee:
          anyOf:
            - $ref: '#/components/schemas/HouseholdMemberRead'
            - type: 'null'
        tags:
          items:
            $ref: '#/components/schemas/TagRead'
          type: array
          title: Tags
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
      type: object
      required:
        - id
        - title
        - start_date
        - repeats
        - assignment_type
        - turn_length
        - repeat_interval
        - weekdays
        - created_at
        - household
        - assignees
        - tags
        - description
      title: ChoreRead
      description: |-
        A single chore: create, `GET /chores/{id}` and patch. Open to every role, since the
        description dialog on My Chores and Unscheduled fetches it.
    ChoreUpdate:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 1
          title: Title
        description:
          anyOf:
            - type: string
              maxLength: 20000
            - type: 'null'
          title: Description
        start_date:
          anyOf:
            - type: string
              format: date
            - type: 'null'
          title: Start Date
        repeats:
          $ref: '#/components/schemas/RepeatPeriod'
        assignment_type:
          $ref: '#/components/schemas/AssignmentType'
        turn_length:
          type: integer
          minimum: 1
          title: Turn Length
          default: 1
        repeat_interval:
          type: integer
          maximum: 365
          minimum: 1
          title: Repeat Interval
          default: 1
        weekdays:
          anyOf:
            - items:
                type: integer
                maximum: 6
                minimum: 0
              type: array
            - type: 'null'
          title: Weekdays
        assignee_ids:
          items:
            type: integer
          type: array
          title: Assignee Ids
        current_assignee_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Current Assignee Id
        clear_current_assignee:
          type: boolean
          title: Clear Current Assignee
          default: false
        tag_ids:
          items:
            type: integer
          type: array
          title: Tag Ids
      type: object
      required:
        - title
        - repeats
        - assignment_type
      title: ChoreUpdate
      description: |-
        Full replace of an editable chore. The household is fixed at creation and
        intentionally not editable here.
    CompleteChoreRequest:
      properties:
        completed_by_user_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Completed By User Id
      type: object
      title: CompleteChoreRequest
      description: |-
        Optional body for POST /chores/{id}/complete. `completed_by_user_id` credits
        the completion to another member so the History shows it under their name;
        it must be one of the chore's current assignees (the chore itself is never
        modified). Omitted or None credits the current user (the default).
    CompletionBucket:
      properties:
        bucket:
          type: string
          title: Bucket
        count:
          type: integer
          title: Count
        skipped:
          type: integer
          title: Skipped
      type: object
      required:
        - bucket
        - count
        - skipped
      title: CompletionBucket
      description: |-
        One point on the completions-over-time chart. `bucket` is an ISO date: the day
        itself when granularity is `day`, or the week's Monday when granularity is `week`.

        Two series over the same buckets: `count` is the work completed, `skipped` the
        occurrences closed without being done. Every bucket in the range is present with both
        at 0 if need be, so the stacked bars keep a continuous axis.
    CompletionRead:
      properties:
        id:
          type: integer
          title: Id
        chore_id:
          type: integer
          title: Chore Id
        title:
          type: string
          title: Title
        scheduled_for:
          type: string
          format: date-time
          title: Scheduled For
        completed_by_user_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Completed By User Id
        skipped:
          type: boolean
          title: Skipped
        created_at:
          type: string
          format: date-time
          title: Created At
        next_due:
          type: string
          format: date-time
          title: Next Due
        days_until_due:
          type: integer
          title: Days Until Due
        status:
          $ref: '#/components/schemas/DueStatus'
      type: object
      required:
        - id
        - chore_id
        - title
        - scheduled_for
        - completed_by_user_id
        - skipped
        - created_at
        - next_due
        - days_until_due
        - status
      title: CompletionRead
      description: |-
        The result of closing a chore's occurrence: the recorded closure plus the chore's
        recomputed due state. Always populated, since closing a chore always reopens it
        (an unscheduled chore reopens at the completion moment, so it reads as due today).

        Shared by `POST /chores/{id}/complete` and `POST /chores/{id}/skip`, and `skipped` is
        what tells them apart. It is echoed rather than inferred from the route so a non-browser
        client can read what it created straight off the 201; `completed_by_user_id` is whoever
        the closure is recorded against either way, which for a skip is always the caller.
    ConfirmRequest:
      properties:
        password:
          type: string
          minLength: 8
          title: Password
      type: object
      required:
        - password
      title: ConfirmRequest
    ConfirmTokenInfo:
      properties:
        email:
          type: string
          title: Email
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
      type: object
      required:
        - email
        - first_name
        - last_name
      title: ConfirmTokenInfo
      description: |-
        Public info returned for a valid confirmation token so the set-password
        page can greet the user before they submit.
    DueChoreRead:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        repeats:
          $ref: '#/components/schemas/RepeatPeriod'
        repeat_interval:
          type: integer
          title: Repeat Interval
        weekdays:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          title: Weekdays
        next_due:
          type: string
          format: date-time
          title: Next Due
        days_until_due:
          type: integer
          title: Days Until Due
        status:
          $ref: '#/components/schemas/DueStatus'
        has_description:
          type: boolean
          title: Has Description
        household:
          $ref: '#/components/schemas/ChoreHouseholdRead'
        assignees:
          items:
            $ref: '#/components/schemas/HouseholdMemberRead'
          type: array
          title: Assignees
      type: object
      required:
        - id
        - title
        - repeats
        - repeat_interval
        - weekdays
        - next_due
        - days_until_due
        - status
        - has_description
        - household
        - assignees
      title: DueChoreRead
      description: |-
        A chore due within the Home window, with its computed due state plus the
        household it belongs to and its assignees, so a row can show whose chore it is
        (data-minimised member shape: no email).
    DueStatus:
      type: string
      enum:
        - overdue
        - today
        - soon
      title: DueStatus
      description: |-
        Where a chore's next occurrence falls relative to today, as the chore's household
        reckons a day.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthRead:
      properties:
        status:
          type: string
          enum:
            - ok
            - error
          title: Status
        database:
          type: string
          enum:
            - ok
            - unreachable
          title: Database
      type: object
      required:
        - status
        - database
      title: HealthRead
      description: |-
        What the probe reports.

        `database` names the subsystem rather than only the verdict, so a 503 says *what* is
        down; the endpoint answers with this shape on both codes.
    HistoryEntryRead:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        scheduled_for:
          type: string
          format: date-time
          title: Scheduled For
        completed_at:
          type: string
          format: date-time
          title: Completed At
        completed_timezone:
          anyOf:
            - type: string
            - type: 'null'
          title: Completed Timezone
        skipped:
          type: boolean
          title: Skipped
        days_late:
          anyOf:
            - type: integer
            - type: 'null'
          title: Days Late
        completed_by:
          anyOf:
            - $ref: '#/components/schemas/HouseholdMemberRead'
            - type: 'null'
        household:
          $ref: '#/components/schemas/ChoreHouseholdRead'
      type: object
      required:
        - id
        - title
        - scheduled_for
        - completed_at
        - completed_timezone
        - skipped
        - days_late
        - completed_by
        - household
      title: HistoryEntryRead
      description: |-
        One closed-occurrence row for the History view.

        `title` is the snapshot taken at closing time (survives a later rename or a
        soft-deleted chore); `completed_at` is when it was actually checked off and
        `scheduled_for` is the occurrence's due datetime, so `days_late` (>0 late, <=0
        on time/early) is the date-based difference between them. It is None for an
        unscheduled chore, which had no due date to be late against: there the slot merely
        records when the chore became available, so subtracting it would report the gap since
        the last completion as lateness. `completed_by` is
        None when the completer's account has been hard-deleted (users are normally
        soft-deleted, so in practice it stays set). Names only on `completed_by`
        (HouseholdMemberRead is data-minimised: no email).

        `skipped` marks the rows where the occurrence was closed without the work being done.
        They belong in the list (something did happen to that slot, and it can be undone like
        any other) but must be readable as distinct from real completions, which is what this
        flag is for. Their `days_late` is None too: there was a deadline, but no work to be
        punctual about.
    HistoryFilterOptions:
      properties:
        households:
          items:
            $ref: '#/components/schemas/ChoreHouseholdRead'
          type: array
          title: Households
        members:
          items:
            $ref: '#/components/schemas/HouseholdMemberRead'
          type: array
          title: Members
      type: object
      required:
        - households
        - members
      title: HistoryFilterOptions
      description: |-
        The option lists for the History filters: the households the current user
        belongs to, and the distinct active members across those households (the
        people who could appear in the "completed by" column).
    HomeRead:
      properties:
        progress:
          $ref: '#/components/schemas/ProgressRead'
        items:
          items:
            $ref: '#/components/schemas/DueChoreRead'
          type: array
          title: Items
      type: object
      required:
        - progress
        - items
      title: HomeRead
    HouseholdCreate:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        timezone:
          type: string
          maxLength: 64
          title: Timezone
      type: object
      required:
        - name
        - timezone
      title: HouseholdCreate
    HouseholdInvitationInfo:
      properties:
        household_name:
          type: string
          title: Household Name
        invited_by:
          $ref: '#/components/schemas/HouseholdMemberRead'
      type: object
      required:
        - household_name
        - invited_by
      title: HouseholdInvitationInfo
      description: 'Public info shown on the accept page: which household and who invited.'
    HouseholdInvitationRead:
      properties:
        id:
          type: integer
          title: Id
        url:
          type: string
          title: Url
        status:
          $ref: '#/components/schemas/HouseholdInvitationStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
        - id
        - url
        - status
        - created_at
        - expires_at
      title: HouseholdInvitationRead
      description: |-
        An invitation as the owner sees it in the list. `url` is the shareable
        link; `status` carries the full lifecycle including `expired` (set by the
        hourly sweep), which the UI uses for the display state and the row's action.
        `expires_at` is kept only for the "expires/expired {when}" label.
    HouseholdInvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - revoked
        - expired
      title: HouseholdInvitationStatus
      description: |-
        Stored lifecycle of an invitation. `expired` is set by the hourly sweep
        (mark_expired_invitations) once a `pending` invite passes `expires_at`;
        runtime checks trust `status`, not the date. Stored as a plain String
        (closed set enforced at the schema layer, like UserStatus), so adding this
        value stays migration-free.
    HouseholdListRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        admin_id:
          type: integer
          title: Admin Id
        timezone:
          type: string
          title: Timezone
        created_at:
          type: string
          format: date-time
          title: Created At
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Deleted At
        member_count:
          type: integer
          title: Member Count
        chore_count:
          type: integer
          title: Chore Count
      type: object
      required:
        - id
        - name
        - admin_id
        - timezone
        - created_at
        - deleted_at
        - member_count
        - chore_count
      title: HouseholdListRead
      description: |-
        A household row for the management tables and the edit-page header.

        `member_count` counts active members only (disabled users are hidden
        everywhere); `chore_count` counts every chore in the household. `deleted_at`
        is NULL for active households and a timestamp for soft-deleted ones.
    HouseholdLogAction:
      type: string
      enum:
        - chore_created
        - chore_updated
        - chore_deleted
        - completion_undone
        - skip_undone
      title: HouseholdLogAction
      description: |-
        What a log entry records. A closed set enforced at the schema layer, since the
        column is a plain String - see the note on HouseholdLogEntry.action.

        Undoing a completion and undoing a skip are two actions rather than one with a flag:
        they read completely differently to whoever is looking at the log ("Sam undid Jo's
        completion of Bins" is somebody's work being erased, "Sam undid Jo's skip of Bins" is
        a mis-skip being fixed), and nothing downstream would re-derive which it was.
    HouseholdMemberRead:
      properties:
        id:
          type: integer
          title: Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
      type: object
      required:
        - id
        - first_name
        - last_name
      title: HouseholdMemberRead
    HouseholdMemberRoleRead:
      properties:
        id:
          type: integer
          title: Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        role:
          $ref: '#/components/schemas/HouseholdRole'
      type: object
      required:
        - id
        - first_name
        - last_name
        - role
      title: HouseholdMemberRoleRead
      description: |-
        A member as the household's own members table sees them: with their role.

        Deliberately a subclass used by the two members endpoints alone. `role` lives on the
        `household_members` association row, and the six other payloads built from
        `HouseholdMemberRead` (assignees on Home, Unscheduled and a chore read, History's
        `completed_by`, the filter options, an invitation's `invited_by`) have no membership in
        hand to read one from - putting it on the base would either leak a role into all of them
        or fail validation there.
    HouseholdMemberUpdate:
      properties:
        role:
          $ref: '#/components/schemas/HouseholdRole'
      type: object
      required:
        - role
      title: HouseholdMemberUpdate
      description: |-
        Body of PATCH /households/{id}/members/{user_id}. Role is the only mutable
        thing about a membership, and an unknown one is a 422 rather than a stored value
        the permission checks would silently read as "no role".
    HouseholdRole:
      type: string
      enum:
        - organiser
        - deputy
        - helper
      title: HouseholdRole
      description: |-
        What a member may do inside one household. A ladder, not a set of flags:
        organiser > deputy > helper, and `app.core.households.roles_at_least` is the
        only place that ordering is written down.

        organiser manages the household's chores and tags on top of everything a
        deputy can do; deputy adds Statistics, and the whole household's History
        rather than only their own rows; helper ticks chores off and sees their own
        closures on History. Household *ownership* stays a separate fact
        (`Household.admin_id`) and outranks all three: the owner is always an
        organiser, and only they rename or delete the household, remove members or
        transfer it. Setting roles and inviting are organiser-level, with one
        asymmetry - an organiser may not grant `organiser` or change a row that
        already holds it, so only the owner can grow that set.
    HouseholdUpdate:
      properties:
        name:
          anyOf:
            - type: string
              maxLength: 255
              minLength: 1
            - type: 'null'
          title: Name
        admin_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Admin Id
        timezone:
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
          title: Timezone
      type: object
      title: HouseholdUpdate
    LogEntryRead:
      properties:
        id:
          type: integer
          title: Id
        action:
          type: string
          title: Action
        created_at:
          type: string
          format: date-time
          title: Created At
        household:
          $ref: '#/components/schemas/ChoreHouseholdRead'
        actor:
          anyOf:
            - $ref: '#/components/schemas/HouseholdMemberRead'
            - type: 'null'
        target:
          anyOf:
            - $ref: '#/components/schemas/HouseholdMemberRead'
            - type: 'null'
        chore_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Chore Id
        chore_title:
          anyOf:
            - type: string
            - type: 'null'
          title: Chore Title
        changed_fields:
          items:
            type: string
          type: array
          title: Changed Fields
          default: []
        by_admin:
          type: boolean
          title: By Admin
          default: false
      type: object
      required:
        - id
        - action
        - created_at
        - household
        - actor
        - target
        - chore_id
        - chore_title
      title: LogEntryRead
      description: |-
        One row of a household's activity log, for the owner-only Logs view.

        `chore_title` is the snapshot taken when the entry was written, so a renamed or
        soft-deleted chore still reads correctly; `chore_id` is carried alongside it so a future UI
        could link to the chore (nothing does yet), and is None only after a hard delete (chores are
        soft-deleted, so in practice it stays set). `actor` is None when that account has been
        hard-deleted, the same way History's `completed_by` is. `target` is who a closure was
        recorded against, and is None for the three chore actions.

        Both people are `HouseholdMemberRead` (data-minimised: no email), and there is no IP
        address here at all - unlike `audit_events`, which this table deliberately is not.

        `action` and `changed_fields` are both plain strings on the wire rather than the enum and a
        Literal union, for the same reason: a value written by a differently-versioned server must
        not break a read, so the closed set lives on the client, which degrades an unknown name
        instead. Coercing `action` back through `HouseholdLogAction` here would raise `ValueError`
        on a row a newer release wrote - a 500 on every page containing it, unfilterable, because
        the coercion is per row after the query. The enum still guards the `action` *query
        parameter*, where a 422 on nonsense input is exactly right.

        `changed_fields` is populated for `chore_updated` alone and is a plain list of names, never
        values, in the order `CHORE_LOG_FIELDS` declares.

        `by_admin` says the action was taken through an impersonated session. A boolean, never the
        operator's identity: the impersonator is a site admin, potentially a stranger to this
        household, so who they were stays in the table for the operator-level trail.
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
        remember:
          type: boolean
          title: Remember
          default: false
      type: object
      required:
        - email
        - password
      title: LoginRequest
    LoginResponse:
      properties:
        two_factor_required:
          type: boolean
          title: Two Factor Required
          default: false
        user:
          anyOf:
            - $ref: '#/components/schemas/MeRead'
            - type: 'null'
      type: object
      title: LoginResponse
      description: |-
        Outcome of the password step. When two_factor_required is False the user
        is fully logged in and `user` is populated; when True a short-lived 2FA
        challenge cookie has been set and the client must POST the code to
        /auth/verify-2fa (user is None until then).
    MeRead:
      properties:
        id:
          type: integer
          title: Id
        email:
          type: string
          title: Email
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        is_admin:
