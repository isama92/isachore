              enum:
                - latte
                - frappe
                - macchiato
                - mocha
            - type: 'null'
          title: Theme
        accent_color:
          anyOf:
            - type: string
              enum:
                - rosewater
                - flamingo
                - pink
                - mauve
                - red
                - maroon
                - peach
                - yellow
                - green
                - teal
                - sky
                - sapphire
                - blue
                - lavender
            - type: 'null'
          title: Accent Color
        language:
          anyOf:
            - type: string
              enum:
                - en
                - it
            - type: 'null'
          title: Language
        two_factor_enabled:
          type: boolean
          title: Two Factor Enabled
          default: false
        avatar_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Avatar Url
          description: |-
            URL the SPA can load the avatar from. Served by the StaticFiles mount
            at /api/v1/media (proxied untouched by the prod nginx /api rule).
          readOnly: true
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - is_admin
        - status
        - created_at
        - avatar_url
      title: UserRead
    UserStatus:
      type: string
      enum:
        - waiting_confirmation
        - active
        - disabled
      title: UserStatus
      description: |-
        Account lifecycle. A user is created either waiting_confirmation (they
        set their own password via an emailed link) or active (an admin set the
        password directly); disabled is the soft-deleted / suspended state. Only an
        active user can log in or be impersonated.
    UserUpdate:
      properties:
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
          title: Email
        first_name:
          anyOf:
            - type: string
              maxLength: 255
              minLength: 1
            - type: 'null'
          title: First Name
        last_name:
          anyOf:
            - type: string
              maxLength: 255
              minLength: 1
            - type: 'null'
          title: Last Name
        password:
          anyOf:
            - type: string
              minLength: 8
            - type: 'null'
          title: Password
        is_admin:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Is Admin
        status:
          anyOf:
            - $ref: '#/components/schemas/UserStatus'
            - type: 'null'
      type: object
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
