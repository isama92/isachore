openapi: 3.1.0
info:
  title: isachore API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRead'
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRead'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify-2fa:
    post:
      tags:
        - auth
      summary: Verify Two Factor
      description: |-
        Second step of a two-step login: verify the TOTP (or recovery) code
        against the challenge parked by /login, then mint the real session.
      operationId: verify_two_factor_api_v1_auth_verify_2fa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/v1/auth/methods:
    get:
      tags:
        - auth
      summary: Auth Methods
      description: |-
        Which ways in the login page should offer. Public: the page that asks has nobody
        signed in yet, by definition.

        `password_enabled` reads the same condition as the 403 in `login` above, so the two
        cannot disagree - the form is never hidden while the endpoint works, nor offered
        while it refuses.
      operationId: auth_methods_api_v1_auth_methods_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsRead'
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeRead'
  /api/v1/auth/stop-impersonating:
    post:
      tags:
        - auth
      summary: Stop Impersonating
      operationId: stop_impersonating_api_v1_auth_stop_impersonating_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
  /api/v1/auth/oidc/start:
    get:
      tags:
        - auth
      summary: Start
      description: 'Begin a sign-on: park the flow''s secrets and send the browser to the provider.'
      operationId: start_api_v1_auth_oidc_start_get
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Return To
      responses:
        '302':
          description: Redirect to the provider's authorisation endpoint
        '404':
          description: Single sign-on is not configured on this server
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/oidc/callback:
    get:
      tags:
        - auth
      summary: Callback
      description: 'Finish a sign-on: verify what the provider said, then decide who that is here.'
      operationId: callback_api_v1_auth_oidc_callback_get
      parameters:
        - name: code
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Code
        - name: state
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: State
        - name: error
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Error
      responses:
        '302':
          description: 'Redirect back to the SPA: signed in, or ?sso_error=<code>'
        '404':
          description: Single sign-on is not configured on this server
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
        - users
      summary: List Users
      operationId: list_users_api_v1_users_get
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Page Size
        - name: sort_by
          in: query
          required: false
          schema:
            enum:
              - id
              - name
              - email
              - created_at
            type: string
            default: created_at
            title: Sort By
        - name: sort_dir
          in: query
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
            default: desc
            title: Sort Dir
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 255
              - type: 'null'
            title: Name
        - name: email
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 255
              - type: 'null'
            title: Email
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/UserStatus'
              - type: 'null'
            title: Status
        - name: role
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - admins
                  - members
                type: string
              - type: 'null'
            title: Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UserRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
        - users
      summary: Create User
      operationId: create_user_api_v1_users_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}:
    get:
      tags:
        - users
      summary: Get User
      operationId: get_user_api_v1_users__user_id__get
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
        - users
      summary: Update User
      operationId: update_user_api_v1_users__user_id__patch
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - users
      summary: Deactivate User
      operationId: deactivate_user_api_v1_users__user_id__delete
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}/impersonate:
    post:
      tags:
        - users
      summary: Impersonate User
      operationId: impersonate_user_api_v1_users__user_id__impersonate_post
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}/reset-2fa:
    post:
      tags:
        - users
      summary: Reset Two Factor
      description: |-
        Clear a user's two-factor enrolment (secret + recovery codes + any pending
        challenges), for when they've lost their authenticator and can't get in.
        Deliberately does NOT revoke the user's sessions: 2FA reset is about future
        logins, and a locked-out user usually has no live session anyway. Idempotent.
      operationId: reset_two_factor_api_v1_users__user_id__reset_2fa_post
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}/resend-confirmation:
    post:
      tags:
        - users
      summary: Resend Confirmation
      operationId: resend_confirmation_api_v1_users__user_id__resend_confirmation_post
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/confirm/{token}:
    get:
      tags:
        - confirm
      summary: Confirmation Info
      description: |-
        Validate a confirmation link so the set-password page can greet the user
        (or show an invalid/expired state) before they submit.
      operationId: confirmation_info_api_v1_confirm__token__get
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmTokenInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
        - confirm
      summary: Confirm Account
      description: |-
        Set the user's password from the confirmation link, activate the account,
        consume the token, and log the user straight in.
      operationId: confirm_account_api_v1_confirm__token__post
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            title: Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings:
    get:
      tags:
        - settings
      summary: Read Settings
      operationId: read_settings_api_v1_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettingsRead'
    patch:
      tags:
        - settings
      summary: Update Settings
      operationId: update_settings_api_v1_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerSettingsUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettingsRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/settings/test-email:
    post:
      tags:
        - settings
      summary: Send Test Email
      operationId: send_test_email_api_v1_settings_test_email_post
      responses:
        '204':
          description: Successful Response
  /api/v1/profile:
    patch:
      tags:
        - profile
      summary: Update Profile
      description: |-
        Update the current user's own name, appearance (theme/accent), language
        and/or password. Self-service edits reuse the user_updated audit action
        (actor == target); if an admin is doing this while impersonating,
        impersonator_id keeps the trail back to them.
      operationId: update_profile_api_v1_profile_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/avatar:
    put:
      tags:
        - profile
      summary: Upload Avatar
      description: |-
        Replace the current user's avatar. The file is decoded, validated and
        re-encoded before it touches disk (see app.core.avatars).
      operationId: upload_avatar_api_v1_profile_avatar_put
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_avatar_api_v1_profile_avatar_put'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - profile
      summary: Remove Avatar
      description: Remove the current user's avatar (falls back to initials). Idempotent.
      operationId: remove_avatar_api_v1_profile_avatar_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
  /api/v1/profile/2fa/setup:
    post:
      tags:
        - two-factor
      summary: Setup Two Factor
      description: |-
        Begin enrolment: generate a fresh secret (stored encrypted but not yet
        active) and return the QR / manual key. Confirm with a code to activate.
      operationId: setup_two_factor_api_v1_profile_2fa_setup_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupRead'
  /api/v1/profile/2fa/confirm:
    post:
      tags:
        - two-factor
      summary: Confirm Two Factor
      description: |-
        Finish enrolment: verify a code from the just-scanned authenticator, then
        activate 2FA and hand back the one-time recovery codes.
      operationId: confirm_two_factor_api_v1_profile_2fa_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/2fa/recovery-codes:
    post:
      tags:
        - two-factor
      summary: Regenerate Recovery Codes
      description: |-
        Replace the recovery codes with a fresh set (invalidating the old ones).
        Requires a valid current code to prove possession of the second factor.
      operationId: regenerate_recovery_codes_api_v1_profile_2fa_recovery_codes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profile/2fa/disable:
    post:
      tags:
        - two-factor
      summary: Disable Two Factor
      description: |-
        Turn 2FA off. Requires a valid TOTP or recovery code (not the password),
        so only someone holding the second factor can remove it.
      operationId: disable_two_factor_api_v1_profile_2fa_disable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/home:
    get:
      tags:
        - home
      summary: Get Home
      description: |-
        The due view: scheduled chores that are overdue, due today, or upcoming (no cut-off,
        so a chore due weeks out still shows), plus today's completion progress,
        across the user's active households. Unscheduled chores are not due dated and so
        never appear here; `api/v1/unscheduled.py` lists those.

        Filters (both optional): `household_id` narrows to one of the user's
        households; `assignee_id` (repeatable) keeps chores assigned to any of those
        members PLUS unassigned/shared chores (which belong to everyone). With no
        `assignee_id` the whole household is shown. The frontend seeds `assignee_id`
        with the current user, so the default view is "your chores + shared", and
        adding or clearing members widens it. Progress is computed over the same
        filtered scope. A household or member id the user can't see just yields an
        empty scope, like the chores list.
      operationId: get_home_api_v1_home_get
      parameters:
        - name: household_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: Household Id
        - name: assignee_id
          in: query
          required: false
          schema:
            anyOf:
              - type: array
                items:
                  type: integer
              - type: 'null'
            title: Assignee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/unscheduled:
    get:
      tags:
        - unscheduled
      summary: Get Unscheduled
      description: |-
        The unscheduled view: chores with no schedule, which you do whenever you feel like
        it, across the user's active households. They have no due date and are never overdue,
        so there is no progress and no ordering by urgency: the list is alphabetical, and each
        row reports how long since it was last done.

        Unlike the due view every chore here stays listed forever, because completing an
        unscheduled chore reopens it at once (see `core.chores.next_occurrence_after`). Filters
        match the due view: `household_id` narrows to one household, `assignee_id` (repeatable)
        keeps those members' chores plus unassigned/shared ones. Unpaginated, like the due view.
      operationId: get_unscheduled_api_v1_unscheduled_get
      parameters:
        - name: household_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            title: Household Id
        - name: assignee_id
          in: query
          required: false
          schema:
            anyOf:
              - type: array
                items:
                  type: integer
              - type: 'null'
            title: Assignee Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnscheduledRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/households:
    get:
      tags:
        - households
      summary: List Households
      operationId: list_households_api_v1_households_get
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Page Size
        - name: sort_by
          in: query
          required: false
          schema:
            enum:
              - id
              - name
              - created_at
            type: string
            default: created_at
            title: Sort By
        - name: sort_dir
          in: query
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
            default: desc
            title: Sort Dir
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 255
              - type: 'null'
            title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_HouseholdListRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
        - households
      summary: Create Household
      operationId: create_household_api_v1_households_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdListRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/households/{household_id}:
    get:
      tags:
        - households
      summary: Get Household
      operationId: get_household_api_v1_households__household_id__get
      parameters:
        - name: household_id
          in: path
          required: true
          schema:
            type: integer
            title: Household Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdListRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
