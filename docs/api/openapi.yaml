        HouseholdMemberRead).
    ProfileUpdate:
      properties:
        first_name:
          anyOf:
            - type: string
              maxLength: 255
              minLength: 1
            - type: 'null'
          title: First Name
        last_name:
          anyOf:
            - type: string
              maxLength: 255
              minLength: 1
            - type: 'null'
          title: Last Name
        current_password:
          anyOf:
            - type: string
            - type: 'null'
          title: Current Password
        new_password:
          anyOf:
            - type: string
              minLength: 8
            - type: 'null'
          title: New Password
        theme:
          anyOf:
            - type: string
              enum:
                - latte
                - frappe
                - macchiato
                - mocha
            - type: 'null'
          title: Theme
        accent_color:
          anyOf:
            - type: string
              enum:
                - rosewater
                - flamingo
                - pink
                - mauve
                - red
                - maroon
                - peach
                - yellow
                - green
                - teal
                - sky
                - sapphire
                - blue
                - lavender
            - type: 'null'
          title: Accent Color
        language:
          anyOf:
            - type: string
              enum:
                - en
                - it
            - type: 'null'
          title: Language
      type: object
      title: ProfileUpdate
      description: |-
        Self-service profile edit. Changing the password requires the current one
        (the confirm-new-password field is a frontend-only check; the API takes the
        old and new passwords only).
    ProgressRead:
      properties:
        done_today:
          type: integer
          title: Done Today
        total_today:
          type: integer
          title: Total Today
      type: object
      required:
        - done_today
        - total_today
      title: ProgressRead
      description: 'Today''s progress: how many of the overdue-or-due-today chores are done.'
    Punctuality:
      properties:
        on_time:
          type: integer
          title: On Time
        late:
          type: integer
          title: Late
        early:
          type: integer
          title: Early
        skipped:
          type: integer
          title: Skipped
      type: object
      required:
        - on_time
        - late
        - early
        - skipped
      title: Punctuality
      description: |-
        What became of the in-range occurrences of *scheduled* chores: `late` (>0 days late),
        `on_time` (same UTC day), `early` (completed before the due day), or `skipped` (closed
        with the work not done).

        Unscheduled chores are absent, having no deadline to be measured against, so the four do
        NOT sum to `completed_in_range`. They do partition the scheduled occurrences closed in the
        range, since skipping an unscheduled chore is refused outright. Note they do not sum to
        `on_time_rate`'s denominator either, which is the first three only.
    RecoveryCodesRead:
      properties:
        recovery_codes:
          items:
            type: string
          type: array
          title: Recovery Codes
      type: object
      required:
        - recovery_codes
      title: RecoveryCodesRead
      description: The one-time backup codes, returned once at enable / regeneration.
    RepeatPeriod:
      type: string
      enum:
        - manual
        - daily
        - weekly
        - monthly
        - yearly
      title: RepeatPeriod
    ServerSettingsRead:
      properties:
        require_confirmation:
          type: boolean
          title: Require Confirmation
        smtp_configured:
          type: boolean
          title: Smtp Configured
        smtp_host:
          anyOf:
            - type: string
            - type: 'null'
          title: Smtp Host
        smtp_port:
          type: integer
          title: Smtp Port
        smtp_from:
          anyOf:
            - type: string
            - type: 'null'
          title: Smtp From
        oidc_configured:
          type: boolean
          title: Oidc Configured
        oidc_provider_name:
          type: string
          title: Oidc Provider Name
        oidc_issuer:
          anyOf:
            - type: string
            - type: 'null'
          title: Oidc Issuer
        oidc_client_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Oidc Client Id
        oidc_redirect_uri:
          type: string
          title: Oidc Redirect Uri
        oidc_only:
          type: boolean
          title: Oidc Only
      type: object
      required:
        - require_confirmation
        - smtp_configured
        - smtp_port
        - oidc_configured
        - oidc_provider_name
        - oidc_redirect_uri
        - oidc_only
      title: ServerSettingsRead
    ServerSettingsUpdate:
      properties:
        require_confirmation:
          type: boolean
          title: Require Confirmation
      type: object
      required:
        - require_confirmation
      title: ServerSettingsUpdate
    SkippedChoreStat:
      properties:
        chore_id:
          type: integer
          title: Chore Id
        title:
          type: string
          title: Title
        household_name:
          type: string
          title: Household Name
        count:
          type: integer
          title: Count
      type: object
      required:
        - chore_id
        - title
        - household_name
        - count
      title: SkippedChoreStat
      description: |-
        One bar of the most-skipped ranking: how many times this chore was skipped in the
        range. Only chores with at least one skip appear, worst-first and capped, so the list is
        the short "go and look at these" set rather than a full table.

        Soft-deleted chores are absent even though their skips still count in
        `skipped_in_range`: the ranking is a list of chores to go and fix, and a deleted one
        cannot be fixed. It is the only skip figure in this payload that drops them.

        A chore switched to unscheduled after being skipped keeps its skips here, so these counts
        can exceed `punctuality.skipped`, which reads the period live and drops such a chore.

        `title` is the chore's *current* title, not the occurrence's snapshot, so a chore
        renamed mid-range stays one row and reads the same here as on the Chores page. The
        trade-off is the mirror image of History's: there the snapshot is right because a row
        describes one past closure, here the live title is right because a row describes a chore
        that still exists and is still being skipped.

        `household_name` rides along because the page spans every household the caller is a
        deputy in, and two of them can hold a chore with the same title.
    StatsKpis:
      properties:
        completed_in_range:
          type: integer
          title: Completed In Range
        skipped_in_range:
          type: integer
          title: Skipped In Range
        currently_overdue:
          type: integer
          title: Currently Overdue
        on_time_rate:
          anyOf:
            - type: number
            - type: 'null'
          title: On Time Rate
        active_chores:
          type: integer
          title: Active Chores
      type: object
      required:
        - completed_in_range
        - skipped_in_range
        - currently_overdue
        - on_time_rate
        - active_chores
      title: StatsKpis
      description: |-
        The headline numbers shown as stat tiles. `completed_in_range`, `skipped_in_range` and
        `on_time_rate` follow the selected range; `currently_overdue` and
        `active_chores` are a live snapshot (range-independent). `on_time_rate` is the
        fraction of in-range completions that were not late (on time or early), or None
        when none of them had a due date (avoids a divide-by-zero).

        Unscheduled chores count in `completed_in_range` but in none of the other three, which
        all need a due date to mean anything: `on_time_rate`'s denominator is the *scheduled*
        completions only, so it can be None even when `completed_in_range` is not.

        Skipped occurrences are counted apart, in `skipped_in_range`, and are in none of the
        others: `completed_in_range` is work done, and `on_time_rate` measures the punctuality of
        that work, so a run of skips leaves the rate untouched rather than dragging it down.
    StatsRead:
      properties:
        range:
          type: string
          title: Range
        granularity:
          type: string
          title: Granularity
        kpis:
          $ref: '#/components/schemas/StatsKpis'
        completions_over_time:
          items:
            $ref: '#/components/schemas/CompletionBucket'
          type: array
          title: Completions Over Time
        status_breakdown:
          $ref: '#/components/schemas/StatusBreakdown'
        punctuality:
          $ref: '#/components/schemas/Punctuality'
        per_person:
          items:
            $ref: '#/components/schemas/PersonStat'
          type: array
          title: Per Person
        most_skipped:
          items:
            $ref: '#/components/schemas/SkippedChoreStat'
          type: array
          title: Most Skipped
      type: object
      required:
        - range
        - granularity
        - kpis
        - completions_over_time
        - status_breakdown
        - punctuality
        - per_person
        - most_skipped
      title: StatsRead
      description: |-
        The aggregated Statistics payload. `range` echoes the requested window and
        `granularity` (`day`/`week`) tells the frontend how to label the time axis.
    StatusBreakdown:
      properties:
        overdue:
          type: integer
          title: Overdue
        today:
          type: integer
          title: Today
        soon:
          type: integer
          title: Soon
      type: object
      required:
        - overdue
        - today
        - soon
      title: StatusBreakdown
      description: |-
        The currently-open occurrences of *scheduled* chores, split by how their due date sits
        relative to today (a live snapshot). The three sum to `active_chores`, which excludes
        unscheduled chores for the same reason: they have no due date to bucket.
    TagCreate:
      properties:
        household_id:
          type: integer
          title: Household Id
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Color
      type: object
      required:
        - household_id
        - name
        - color
      title: TagCreate
    TagRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
      type: object
      required:
        - id
        - name
        - color
      title: TagRead
    TagUpdate:
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Color
      type: object
      required:
        - name
        - color
      title: TagUpdate
      description: |-
        Full replace of an editable tag. The household is fixed at creation and
        intentionally not editable here (mirrors ChoreUpdate).
    TwoFactorConfirmRequest:
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
          title: Code
      type: object
      required:
        - code
      title: TwoFactorConfirmRequest
      description: Code confirming an authenticator was set up correctly (enable).
    TwoFactorDisableRequest:
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
          title: Code
      type: object
      required:
        - code
      title: TwoFactorDisableRequest
      description: Code proving possession of the second factor when disabling / regenerating.
    TwoFactorSetupRead:
      properties:
        secret:
          type: string
          title: Secret
        otpauth_uri:
          type: string
          title: Otpauth Uri
        qr:
          type: string
          title: Qr
      type: object
      required:
        - secret
        - otpauth_uri
        - qr
      title: TwoFactorSetupRead
      description: Everything the setup UI needs to enrol an authenticator.
    TwoFactorVerifyRequest:
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 1
          title: Code
      type: object
      required:
        - code
      title: TwoFactorVerifyRequest
      description: Code submitted at the login verify step.
    UnscheduledChoreRead:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        days_since_last_completion:
          anyOf:
            - type: integer
            - type: 'null'
          title: Days Since Last Completion
        has_description:
          type: boolean
          title: Has Description
        household:
          $ref: '#/components/schemas/ChoreHouseholdRead'
        assignees:
          items:
            $ref: '#/components/schemas/HouseholdMemberRead'
          type: array
          title: Assignees
      type: object
      required:
        - id
        - title
        - days_since_last_completion
        - has_description
        - household
        - assignees
      title: UnscheduledChoreRead
      description: |-
        An unscheduled chore, as its own view lists it. Deliberately carries no due state:
        there is no deadline to report, and keeping `next_due` / `days_until_due` / `status` off
        the wire is what stops the due vocabulary creeping back into a view that has none. It
        reports how long since the chore was last done instead, which is what you actually want
        to know about something you do ad hoc. `repeats` is omitted too: every item here is
        unscheduled, so the label would be noise.
    UnscheduledRead:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UnscheduledChoreRead'
          type: array
          title: Items
      type: object
      required:
        - items
      title: UnscheduledRead
    UserCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
        first_name:
