name: Publish images

# Post-merge build of the two prod images the compose.prod.*.yml files pull.
# Nothing publishes from a pull request: forks must not be able to move :latest.
on:
  push:
    branches: [main]
    # A prose-only merge cannot change either image, so republishing would just
    # move :latest to a new digest for nothing - and with :latest as the only tag,
    # that silently invalidates any digest an operator recorded to roll back to.
    # Same list as ci.yml. Use workflow_dispatch to publish deliberately.
    paths-ignore:
      - README.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - SECURITY.md
      - COPYING
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  # Never abandon a half-finished push; a superseded commit is instead dropped by
  # its CI being cancelled, which skips the publish job below.
  cancel-in-progress: false

jobs:
  # Called as a reusable workflow rather than chained via `workflow_run`, so the
  # whole gate is one check graph on the commit and `needs` states it plainly.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Push ${{ matrix.name }} to GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing should not cancel the other's push; a partial publish
      # is easier to reason about than an aborted one.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: docker/backend.Dockerfile
            contexts: ""
          - name: frontend
            context: ./frontend
            file: docker/frontend.Dockerfile
            contexts: nginxconf=./docker/nginx
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io/<owner>/<repo>-<service>, derived rather than hardcoded so a
          # fork publishes into its own namespace instead of failing against
          # this one. metadata-action lowercases the result for GHCR.
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          # Single moving tag. Rolling back therefore means pinning a digest from
          # this run's log; see the README if that becomes a habit worth tagging for.
          tags: type=raw,value=latest
          # Supplies org.opencontainers.image.source, which is what makes GHCR
          # show the package as belonging to this repo (and inherit its access).
          labels: |
            org.opencontainers.image.title=isachore-${{ matrix.name }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          build-contexts: ${{ matrix.contexts }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shares the scope the CI build populated, so the merge commit's push
          # mostly reuses layers the PR already built.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
