name: CI

# There is deliberately no `push` trigger: publish.yml calls this workflow for
# the main-branch run, so adding one here would run every main commit twice.
# Consequence worth knowing: a push to a branch with no open PR runs nothing.
on:
  pull_request:
    # Nothing in CI lints these: the prettier hook is scoped `^frontend/` and
    # `npm run format:check` runs with cwd=frontend, so root prose has no check to
    # skip. Markdown under frontend/ is NOT listed, because prettier does cover it.
    paths-ignore:
      - README.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - SECURITY.md
      - COPYING
      - docs/**
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: isachore
          POSTGRES_PASSWORD: isachore_ci_password
          POSTGRES_DB: isachore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isachore -d isachore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mirrors .env.example.dev, with the DB on localhost rather than the
      # compose host `db`. Two things are deliberately absent:
      #   - REDIS_URL: tests/conftest.py overrides get_redis with fakeredis, so
      #     no Redis service is needed and the default is never dialled.
      #   - APP_KEY: the autouse _reset_app_key fixture clears it so crypto
      #     fails closed, and the 2FA tests generate their own key.
      ENVIRONMENT: test
      COOKIES_SECURE: "false"
      DATABASE_URL: postgresql+asyncpg://isachore:isachore_ci_password@localhost:5432/isachore
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Read the toolchain out of the Dockerfile rather than restating it here, so
      # a base-image bump reaches CI on its own. This file used to pin the versions,
      # and a Dependabot bump to python:3.14-slim left CI testing on 3.13 while the
      # published image shipped 3.14. Both captures are digits-and-dots only, so
      # nothing from the file can smuggle anything into the output.
      - id: toolchain
        working-directory: .
        run: |
          {
            echo "python=$(sed -n 's|^FROM python:\([0-9.]*\)-slim.*|\1|p' docker/backend.Dockerfile | head -1)"
            echo "uv=$(sed -n 's|^COPY --from=ghcr.io/astral-sh/uv:\([0-9.]*\) .*|\1|p' docker/backend.Dockerfile | head -1)"
          } >> "$GITHUB_OUTPUT"

      # uv obeys this file, so a mismatch means `uv run` cannot find an interpreter
      # inside the image. Assert it here for a legible message instead.
      - name: backend/.python-version agrees with the image
        working-directory: .
        env:
          IMAGE_PYTHON: ${{ steps.toolchain.outputs.python }}
        run: |
          pinned=$(cat backend/.python-version)
          echo "image=$IMAGE_PYTHON  .python-version=$pinned"
          test "$pinned" = "$IMAGE_PYTHON"

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.toolchain.outputs.uv }}
          python-version: ${{ steps.toolchain.outputs.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --frozen so a stale uv.lock fails here rather than drifting silently
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Creates its own throwaway isachore_test database off DATABASE_URL; the
      # service container's POSTGRES_USER is a superuser, so CREATE DATABASE works.
      - run: uv run pytest

      # The suites build the schema with Base.metadata.create_all and never execute
      # a migration, so a migration problem is invisible to them. Two separate
      # guards, because they catch different failures:
      #   upgrade head -> the migrations actually run on a virgin database. A
      #     migration that seeded a household whose owner could not exist yet once
      #     broke exactly this, making the production first-run impossible.
      #   check -> the migrations still match the models. Without it a model change
      #     with no accompanying revision passes everything (create_all builds the
      #     new column for pytest) and only fails in production, on the column the
      #     migrations never added.
      - name: Migrations build an empty database and match the models
        env:
          PGPASSWORD: isachore_ci_password
          DATABASE_URL: postgresql+asyncpg://isachore:isachore_ci_password@localhost:5432/isachore_migrations
        run: |
          psql -h localhost -U isachore -d postgres -c 'CREATE DATABASE isachore_migrations'
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend (eslint + prettier + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Derived, not restated: see the backend job. Testing on a different node
      # than the image builds with is how node 26 slipped through, where vitest
      # collects 0 tests but lint, tsc and the vite build all still pass.
      - id: toolchain
        working-directory: .
        run: |
          echo "node=$(sed -n 's|^FROM node:\([0-9]*\)-alpine.*|\1|p' docker/frontend.Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      # `tsc -b` runs first, which also typechecks the tests via tsconfig.vitest.json
      - run: npm run build
      - run: npm run test

  images:
    name: Docker (compose config + prod image builds)
    runs-on: ubuntu-latest
    # Pull requests only. On the main-branch run this job would be pure
    # duplication: publish.yml builds the very same targets to push them, and if
    # that build fails nothing is published, so it is already its own gate.
    # `github.event_name` is the ORIGINAL trigger even when called via
    # workflow_call, so this is `push` on the merge path and skips correctly.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Schema and interpolation check on all four compose files. It does NOT
      # stat the Dockerfiles (compose defers `dockerfile:` to build time), so the
      # real guard on the moved Dockerfiles is the two build steps below.
      - name: Validate compose files
        run: |
          # Both .env files are gitignored, so CI has to supply them: compose
          # treats a missing env_file as a hard load error, and each prod mode
          # file reads the .env beside itself, not the repo root's.
          cp .env.example.dev .env
          printf 'POSTGRES_USER=ci\nPOSTGRES_PASSWORD=ci\nPOSTGRES_DB=ci\n' > docker/.env
          docker compose -f compose.yml config -q
          for mode in http tls traefik; do
            docker compose -f "docker/compose.prod.$mode.yml" config -q
          done
          rm -f .env docker/.env

      # Build without pushing, so a broken prod Dockerfile fails the PR. This is
      # the only pre-merge check on the prod images: the prod compose files are
      # pull-only and have no build path.
      - name: Build backend prod image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: docker/backend.Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend prod image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: docker/frontend.Dockerfile
          target: prod
          # The nginx confs configure the image, not the app, so they come from
          # docker/nginx via a named context rather than the build context.
          build-contexts: nginxconf=./docker/nginx
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
