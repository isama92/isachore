version: 2

# Version pins that are coupled across files, which Dependabot cannot know about.
# ci.yml no longer restates the toolchain (it seds python, uv and node out of the
# Dockerfiles), so a base-image bump flows into CI by itself. What is left:
#   - backend/.python-version must match docker/backend.Dockerfile's python. uv
#     obeys it, so a mismatch breaks `uv run` inside the image; ci.yml asserts it.
#   - @types/node (npm) must match docker/frontend.Dockerfile's node major. Nothing
#     checks this: newer types simply describe stdlib the runtime lacks, so `tsc -b`
#     passes and the failure waits until run time. Majors are ignored below.
#   - ruff: .pre-commit-config.yaml's `ruff-pre-commit` rev <-> backend/uv.lock.
#     There is no pre-commit ecosystem, and `uv` moves the lock rather than
#     pyproject's `>=` floor, so a ruff bump lands in one file only.
#   - uv itself: pulled by `COPY --from=ghcr.io/astral-sh/uv:...`, and dependabot's
#     docker parser reads only `FROM` lines, so it never proposes that bump at all.
#   - postgres/redis: pinned in compose.yml, all three docker/compose.prod.*.yml,
#     and again as ci.yml's service container. See the docker-compose note below.
#
# Deliberately NOT configured: the `docker-compose` ecosystem. Its file matcher is
# /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i, which allows a single
# dot-segment after "compose", so it matches compose.yml but NOT
# docker/compose.prod.http.yml and friends. Enabling it would therefore bump
# postgres/redis in the dev stack while leaving all three prod modes behind, and
# silently running dev on a different major Postgres than prod is worse than
# bumping those four files by hand, together, on purpose.

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the safe stuff, majors on their own so they get read properly.
      backend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Must track the node major in docker/frontend.Dockerfile, which is pinned
      # to 24. Types from a newer major describe stdlib APIs the runtime does not
      # have, so `tsc -b` would accept code that fails at run time. Bump this when
      # the Dockerfile's node moves, not before, and not on its own.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript majors change what compiles; 7 is the native rewrite. The build
      # runs `tsc -b`, so this gates every commit and deserves a deliberate
      # upgrade with the suites run against it rather than a monthly PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Matches both docker/backend.Dockerfile and docker/frontend.Dockerfile: the
  # fetcher regex is /dockerfile|containerfile/i, i.e. a substring match, so the
  # `<name>.Dockerfile` layout is picked up.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node 26 ships a native experimental `localStorage` that shadows jsdom's,
      # so vitest collects 0 tests from every file while lint, tsc and the vite
      # build all still pass. Staying on the LTS line until that is handled;
      # drop this entry to move deliberately, not by monthly PR.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
