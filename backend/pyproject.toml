[project]
name = "isachore-backend"
version = "0.1.0"
description = "isachore API - chore management for households"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=3.0.0",
    "alembic>=1.18.5",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31.0",
    "cryptography>=43.0.0",
    "fastapi>=0.140.0",
    "nh3>=0.3.6",
    "pillow>=11.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.20",
    "qrcode>=7.4.2",
    "redis[hiredis]>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    # zoneinfo reads the system tz database first and only falls back to this package, so it
    # is insurance rather than the source. Worth owning explicitly all the same: every
    # household carries an IANA zone now, so a base image that stopped shipping
    # /usr/share/zoneinfo would turn every request into a 500 - and "the Dockerfiles own the
    # toolchain versions" cuts both ways, since a Dependabot bump can change the base image
    # without anyone here deciding to.
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs code inside greenlets; without this, endpoint
# bodies after the first awaited DB call are wrongly reported as uncovered.
concurrency = ["greenlet"]
omit = ["app/cli.py", "app/main.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
