# Shared server-block body for both prod modes: nginx.conf (plain HTTP, behind a
# TLS-terminating reverse proxy) and nginx.tls.conf (nginx terminates TLS with a
# provided certificate). Baked into the image at
# /etc/nginx/snippets/isachore-common.conf and `include`d inside a server {}
# block. Keep to server-context directives so both modes stay identical.

# Keep the nginx version out of the Server header and the built-in error pages.
server_tokens off;

# Security response headers, on every response (errors included, hence `always`).
# HSTS is deliberately NOT here: it belongs only where TLS is terminated
# (nginx.tls.conf, or the upstream proxy in reverse-proxy mode).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# Deny every powerful browser feature: the app uses none of them. Avatar upload
# is a plain file input, which needs no camera grant. If passkeys ever join the
# TOTP 2FA, publickey-credentials-get has to be relaxed to (self).
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
# style-src needs 'unsafe-inline' for Recharts' inline style= attributes and the
# chart <style> block (src/components/ui/chart.tsx, guarded against injection).
# It cannot be tightened: the theme also applies accent colours through runtime
# CSS custom properties, and a statically served SPA has no way to mint a
# per-response nonce (that needs server-side rendering). The chart.tsx injection
# guard is the mitigation. script-src stays locked to 'self' (see
# public/theme-init.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

root /usr/share/nginx/html;
index index.html;

# Container healthcheck target: a static 200 that needs neither the backend nor
# a redirect, so the probe works the same in every prod mode. Unauthenticated
# and internet-reachable by design; it discloses nothing.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# No URI on proxy_pass: the original path (/api/v1/...) is forwarded
# untouched, matching FastAPI's /api/v1 prefix.
location /api/ {
    # Bound request bodies at the transport level so an oversized avatar
    # upload is rejected here rather than fully buffered by the backend.
    # A little above the 5 MB avatar cap to allow multipart overhead. Keep in
    # sync with the backend's MAX_REQUEST_BYTES (its own defence-in-depth cap).
    client_max_body_size 6m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Preserve the client's real scheme when behind a TLS-terminating proxy;
    # fall back to our own listen scheme otherwise (see the $forwarded_proto map).
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}

# nginx's bundled mime.types has no .webmanifest entry, so the manifest would go
# out as application/octet-stream -- and with the nosniff header above, the
# browser then refuses to parse it and the app is simply not installable.
# `default_type` here rather than a `types` block: like add_header, a `types`
# block REPLACES the inherited map rather than adding to it, which would strip
# every other extension. This only fires when the map misses, so it is scoped to
# exactly this file.
location = /manifest.webmanifest {
    default_type application/manifest+json;
}

# The service worker must be revalidated, or a deployed update never reaches an
# installed app. `expires -1` (which emits Cache-Control: no-cache) rather than
# `add_header Cache-Control`, because nginx REPLACES inherited add_header
# directives instead of merging them: an add_header here would silently drop the
# CSP and the four other security headers above from this response. `expires` is
# a separate directive, so they survive. Having the location at all also stops
# the SPA fallback below from answering a missing /sw.js with index.html and a
# 200, which would install HTML as the worker.
location = /sw.js {
    expires -1;
}

# SPA fallback so /login deep-links survive a refresh
location / {
    try_files $uri $uri/ /index.html;
}
