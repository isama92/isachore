# The shared body of the two API-reference locations (/docs and /openapi.json), baked into
# the image at /etc/nginx/snippets/isachore-docs.conf and `include`d from each one in
# nginx-common.conf. Location-context directives only, and NO proxy_pass: the two differ in
# exactly that (one rewrites the path to /redoc, one does not), so it stays at the call site.
#
# Gated on a real session, so this is not a public description of the API surface. Note that
# in DEV none of this applies: there is no nginx, the backend is reached directly on :8000,
# and /docs, /redoc and /openapi.json are all open there.

# nginx asks the backend whether the browser's cookie is a live session before serving
# anything here. The subrequest inherits the original request's headers, Cookie included, so
# the existing session is what authorises; it is a GET, so CsrfProtectMiddleware exempts it
# on method and no header has to be forged for it.
auth_request /_docs_auth;
# A refusal lands on the app's login page rather than a bare nginx 401 body. The `=` is what
# replaces the 401 with the named location's own status, so the browser sees the redirect.
error_page 401 403 = @docs_sign_in;

# Every inherited security header is restated because nginx REPLACES inherited add_header
# directives rather than merging them: the moment this block sets one, the server-level set
# is gone from these responses. Same rule as the /sw.js note in nginx-common.conf, except
# here it is deliberate - the Content-Security-Policy below has to be wider.
#
# SIX of them, not five, and the sixth is the one easy to miss: the tls mode adds HSTS at
# server level in nginx.tls.conf, so a five-header restatement silently dropped it from
# exactly these two responses in exactly that mode. It arrives here through the $hsts map,
# which is "" in the plain-HTTP and traefik modes (where HSTS would be wrong anyway) and
# nginx omits an add_header whose value is empty. If a seventh header is ever added at
# server level, it has to be added here too - there is no mechanism that notices.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# THE ONLY PLACE IN THE DEPLOYMENT THAT PERMITS THIRD-PARTY SCRIPT, and the cost of proxying
# to FastAPI's own reference page rather than shipping a rendered one. Every relaxation below
# was measured against what /redoc actually requests, in a browser, not inferred:
#
#   script-src   jsdelivr serves redoc.standalone.js. NOTE there is no 'unsafe-inline' here:
#                ReDoc's page is a bare <redoc spec-url> element plus that one external
#                script, so it needs none. Swagger UI would - its page carries an inline
#                SwaggerUIBundle({...}) call - which is a second reason only one reader is
#                exposed. Do not add 'unsafe-inline' back without a page that needs it.
#   style-src    ReDoc pulls Montserrat/Roboto CSS from Google Fonts and injects its
#                styled-components rules inline.
#   font-src     the font files that Google Fonts stylesheet then references.
#   img-src      the favicon the page declares, https://fastapi.tiangolo.com/img/favicon.png.
#   worker-src   ReDoc builds its search index in a worker created from a blob: URL.
#
# ONE THING IS DELIBERATELY STILL BLOCKED, and it prints an error every time /docs loads:
#
#   Loading the image 'https://cdn.redoc.ly/redoc/logo-mini.svg' violates ... img-src
#
# That is ReDoc's own watermark, not our content, and the page is complete without it - the
# sidebar, the search and every operation render. Adding a whole third-party origin to
# img-src to satisfy a vendor logo is a worse trade than one explainable console line, so
# the line is documented here rather than designed away. Anything ELSE in that console is a
# real finding.
#
# connect-src stays 'self': the page fetches /openapi.json from this origin and nothing else.
# frame-ancestors and object-src are unchanged. If this ever reads as too much, the way out
# is self-hosting the bundle via get_redoc_html(redoc_js_url=...) rather than widening
# anything further.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
