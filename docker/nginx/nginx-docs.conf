# The shared body of the two API-reference locations (/docs and /openapi.json), baked into
# the image at /etc/nginx/snippets/isachore-docs.conf and `include`d from each one in
# nginx-common.conf. Location-context directives only, and NO proxy_pass: the two differ in
# exactly that (one rewrites the path to /redoc, one does not), so it stays at the call site.
#
# Gated on a real session, so this is not a public description of the API surface. Note that
# in DEV none of this applies: there is no nginx, the backend is reached directly on :8000,
# and /docs, /redoc and /openapi.json are all open there.

# nginx asks the backend whether the browser's cookie is a live session before serving
# anything here. The subrequest inherits the original request's headers, Cookie included, so
# the existing session is what authorises; it is a GET, so CsrfProtectMiddleware exempts it
# on method and no header has to be forged for it.
auth_request /_docs_auth;
# What a refusal LOOKS like is not shared, so `error_page` stays at the call site alongside
# `proxy_pass`: a person who typed /docs wants the login page, and a client fetching
# /openapi.json wants a 401 rather than a 302 that lands it on 200 OK of SPA HTML.

# Every inherited security header has to be restated, because nginx REPLACES an inherited
# add_header set rather than merging it: the moment this block adds one of its own, the
# server-level set is gone from these responses. Same rule as the /sw.js note in
# nginx-common.conf, except here it is deliberate - the Content-Security-Policy below has to
# be wider, and that is the whole reason this file exists.
#
# The invariant ones come from the same file the server level uses, so they cannot fall out
# of step. A hand-written second copy is exactly what dropped HSTS from these two responses
# in the tls mode when this feature was first written: five headers were copied where six
# were inherited, and nothing executable could notice.
include /etc/nginx/snippets/isachore-headers.conf;

# HSTS is the one the shared file leaves out, because at server level it comes from
# nginx.tls.conf - a file operators hold their own copies of. Here it comes from the baked
# $hsts map instead, which is empty except where nginx itself terminated TLS, and nginx
# omits an add_header whose value is empty. See nginx-maps.conf.
add_header Strict-Transport-Security $hsts always;

# The reference page is entirely first-party now - the ReDoc bundle is vendored into the
# backend image and served from this origin, and Google Fonts is switched off (see
# app/api/v1/docs.py) - so this policy is LITERALLY the app's own, `$csp_base` from
# nginx-maps.conf, with exactly ONE directive appended:
#
#   worker-src 'self' blob:   ReDoc builds its search index in a worker created from a blob:
#                             URL. Without it the page renders and the search box is dead.
#
# Everything else it needs, the app-wide policy already allows: 'unsafe-inline' styles (which
# Recharts needs anyway, and ReDoc's styled-components use), `data:` fonts, and connect-src
# 'self' for the /openapi.json fetch. There is NO third-party origin here at all any more,
# and no 'unsafe-inline' in script-src - ReDoc's page is a bare <redoc> element plus one
# external script, unlike Swagger UI, whose inline SwaggerUIBundle({...}) call is a second
# reason only one reader is published.
#
# Reading the shared map rather than restating the policy is deliberate: at a one-directive
# delta, two hand-written copies would drift the first time somebody tightened the app's -
# which is the same shape of mistake as restating five security headers where six were
# inherited. `worker-src` stays here rather than joining the map because nothing in the SPA
# creates a worker from a blob, so widening the app-wide policy would buy nothing.
#
# ONE THING IS DELIBERATELY STILL BLOCKED, and it prints an error every time /docs loads:
#
#   Loading the image 'https://cdn.redoc.ly/redoc/logo-mini.svg' violates ... img-src
#
# That is ReDoc's own watermark, not our content, and the page is complete without it - the
# sidebar, the search and every operation render. Adding a third-party origin to img-src to
# satisfy a vendor logo would undo the point of vendoring the bundle in the first place. So
# the line is documented here rather than designed away, and anything ELSE in that console
# is a real finding.
add_header Content-Security-Policy "$csp_base; worker-src 'self' blob:" always;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
