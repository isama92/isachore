# Variables shared by every prod mode, baked to /etc/nginx/conf.d/00-isachore-maps.conf.
#
# It lives in conf.d rather than in a snippet because a `map` is http-context and the
# snippets are server- and location-context. The `00-` prefix is not cosmetic: the stock
# image includes `conf.d/*.conf` in alphabetical order, so this is parsed before
# `default.conf` whichever mode file is providing that.
#
# **Being baked is the whole point.** The tls mode bind-mounts an operator's own copy of
# nginx.tls.conf over conf.d/default.conf, so anything the baked snippets need has to come
# from a file the image owns. Defining $hsts in the mode files instead meant that an
# operator who ran `docker compose pull && up -d` with the copy they already had got
# `nginx: [emerg] unknown "hsts" variable` and a frontend container that would not start -
# the entire site down, not just the reference. Do not move these into a mode file.

# HSTS, or nothing. `nginx-docs.conf` restates every inherited security header (nginx
# replaces rather than merges `add_header`), and HSTS is the one that varies by mode, so it
# needs a value it can use without knowing which mode it is in.
#
# Keyed on $scheme, which nginx always defines, so the answer is "yes when nginx itself
# terminated TLS": true in the tls mode's :443 block, false in the http and traefik modes
# where the upstream proxy terminates and owns its own HSTS. That reproduces exactly what
# each mode did before this existed. nginx omits an add_header whose value is empty, so the
# non-TLS modes still send none.
#
# nginx.tls.conf's own server-level header reads this too, which keeps the policy in one
# place going forward - but a pre-existing copy carrying the literal string works
# unchanged, which is what makes upgrading safe in both directions.
map $scheme $hsts {
    default "";
    https   "max-age=63072000; includeSubDomains";
}
