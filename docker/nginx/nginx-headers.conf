# The security response headers that are the same everywhere, baked to
# /etc/nginx/snippets/isachore-headers.conf and included in TWO places: at server level from
# nginx-common.conf, and again at location level from nginx-docs.conf.
#
# Included twice on purpose, and that is the whole design. nginx REPLACES an inherited
# `add_header` set rather than merging it, so the moment a location adds one header of its
# own it loses every server-level header - which is why the /docs locations, whose entire
# reason for existing is a wider Content-Security-Policy, have to restate the rest. Writing
# them out a second time is what dropped HSTS from those responses in the tls mode during
# the change that introduced them: five were copied where six were inherited, and nothing
# that runs could notice.
#
# So: **a new security header goes here and nowhere else.** It then reaches the ordinary
# responses and the API reference through the same include, with no second copy to forget.
#
# Two are deliberately absent, because they genuinely differ between the two contexts rather
# than being duplication:
#   Content-Security-Policy   the docs pages need a wider one (see nginx-docs.conf).
#   Strict-Transport-Security set at server level by nginx.tls.conf alone, since that file
#                             is the only place TLS is terminated - and it is a file
#                             operators hold their own copies of, so adding a second
#                             server-level copy here would send the header twice for them.
#                             nginx-docs.conf restates it from the baked $hsts map instead.
#
# `always` on each, so they are sent on error responses too.

# Keep the nginx version out of the Server header and the built-in error pages. Not an
# add_header, so the replacement rule does not apply to it, but it belongs with its siblings.
server_tokens off;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# Deny every powerful browser feature: the app uses none of them. Avatar upload is a plain
# file input, which needs no camera grant. If passkeys ever join the TOTP 2FA,
# publickey-credentials-get has to be relaxed to (self).
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
