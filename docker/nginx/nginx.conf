# Default baked config: plain HTTP. TLS is terminated upstream (reverse proxy /
# Traefik) in this mode. For nginx to terminate TLS itself, compose.prod.tls.yml
# swaps in nginx.tls.conf over this file. The shared body lives in
# nginx-common.conf (baked to /etc/nginx/snippets/isachore-common.conf).

# Use the client's forwarded scheme if a proxy set one, else our listen scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # Behind a TLS-terminating proxy (Traefik etc.) nginx's peer is the proxy,
    # not the client, so recover the real client from X-Forwarded-For. Only
    # connections from private ranges (where the proxy runs on the container
    # network) are trusted, so a public client cannot spoof this. The proxy must
    # set X-Forwarded-For to the real client and not trust client-supplied values
    # (Traefik's default). Without this, per-IP login/2FA rate limiting collapses
    # every request onto the proxy's single IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/isachore-common.conf;
}
