# Development stack. The prod modes live in docker/ and pull published images
# instead of building; this is the only compose file that builds anything.
services:
  backend:
    build:
      context: ./backend
      # The Dockerfiles live in docker/, but the contexts stay at the app roots:
      # a relative `dockerfile` is resolved from the context, while every COPY
      # inside them is context-relative, so nothing else had to change.
      dockerfile: ../docker/backend.Dockerfile
      target: dev
    env_file: .env
    # Every dev port is published on the loopback interfaces only, never on the
    # LAN: this stack runs with the documented placeholder credentials from
    # .env.example.dev. Both families are listed because a bare "127.0.0.1:" prefix
    # would stop publishing on IPv6, leaving tooling that resolves localhost to
    # ::1 without a listener. (On a host with IPv6 disabled entirely, drop the
    # [::1] lines: publishing them fails.) Nothing in the app depends on these
    # host ports -
    # the frontend reaches the backend over the compose network
    # (BACKEND_ORIGIN: http://backend:8000).
    ports:
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: dev
      additional_contexts:
        # Only the prod stage copies from this, but it is declared here too:
        # without it a `COPY --from=nginxconf` would fall back to resolving
        # `nginxconf` as an image name, which fails obscurely.
        nginxconf: ./docker/nginx
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
      - "[::1]:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "[::1]:8025:8025"

volumes:
  pgdata:
  frontend_node_modules:
